name: Deploy site to GitHub Pages

# No build step: the site lives in web/ and is served as-is.
# Data files under web/data/ are authored by the processing workflow and committed.
# One-time before the first push (repo does not enable Pages on creation):
#   gh api -X POST /repos/<owner>/gardens-grimoire/pages -f build_type=workflow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
